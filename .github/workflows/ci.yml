name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # Matches deploy-site.yml. The Worker itself runs on workerd, not
          # Node -- Node only runs vitest here.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: cp wrangler.jsonc.example wrangler.jsonc
      - run: npm run type-check

  plugin:
    name: plugin (pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 24
          cache: npm
      # Same install shape as publish-npm.yml: prepack bundles ../cli, whose
      # dependencies come from the root package. Catches a broken release
      # before a tag is pushed.
      - run: npm ci
      - run: npm install
        working-directory: openclaw-plugin
      - run: npx tsc --noEmit
        working-directory: openclaw-plugin
      - run: npm pack --dry-run
        working-directory: openclaw-plugin
      - run: node test/pack-smoke.mjs
        working-directory: openclaw-plugin
